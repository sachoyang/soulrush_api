<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soul Rush Admin Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== 로그인 화면 (원본 admin_hub.php 의 비밀번호 게이트) ===== -->
  <div id="loginView" class="center-screen" style="display:none;">
    <div class="login-box">
      <h2>🔐 Soul Rush 통합 관리자</h2>
      <form id="loginForm">
        <input type="password" id="pwInput" placeholder="비밀번호 입력" required autofocus autocomplete="current-password">
        <button type="submit">접속</button>
      </form>
      <p class="login-error" id="loginError"></p>
      <div class="login-foot">
        API 서버: <span id="apiBaseLabel"></span><br>
        <button type="button" id="btnApiBaseLogin">API 주소 변경</button>
      </div>
    </div>
  </div>

  <!-- ===== 허브 화면 ===== -->
  <div id="hubView" style="display:none;">
    <div class="header">
      <div class="header-left">
        <h2>🛠️ Soul Rush 통합 관리자 대시보드</h2>
        <span class="msg" id="msg"></span>
      </div>
      <div class="header-tools">
        <span class="api-base" id="hubApiBase"></span>
        <button type="button" class="btn btn-ghost" id="btnApiBaseHub">API 주소</button>
        <button type="button" class="btn btn-danger" id="btnLogout">로그아웃</button>
      </div>
    </div>

    <div class="hub">
      <div class="menu-container">
        <a href="users.html" class="menu-btn">👤 유저 DB 관리<span>가입자 확인, PW 초기화</span></a>
        <a href="abilities.html" class="menu-btn">⚔️ 스킬 모듈 관리<span>능력 생성, 수치 수정</span></a>
        <a href="rankings.html" class="menu-btn">🏆 팀 랭킹 관리<span>클리어 기록 조회, 삭제</span></a>
        <a href="crashes.html" class="menu-btn">💥 크래시 리포트<span>예외/네이티브 크래시 확인</span></a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/hub.js"></script>
</body>
</html>
